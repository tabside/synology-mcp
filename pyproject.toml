[project]
name = "synology-mcp"
# Nur Major.Minor wird von Hand gepflegt, der Patch-Teil wird automatisch
# aus der Git-Historie gezaehlt (siehe _read_version im Paket).
version = "0.3.0"
description = "MCP-Server fuer eine Synology-NAS (DSM 7): Zustand, Speicher, Disks, Backups, Updates und Logs lesen und berichten, nur lesend"
requires-python = ">=3.12"
dependencies = [
    "uvicorn==0.54.0",
    "starlette==1.9.0",
    "mcp==1.30.0",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["synology_mcp"]
