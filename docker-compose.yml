services:
  synology-mcp:
    # Fertiges Image aus der GitHub Container Registry (per GitHub Actions bei jedem Push auf main gebaut)
    image: ghcr.io/tabside/synology-mcp:latest
    pull_policy: always
    container_name: synology-mcp-cloud
    restart: unless-stopped
    environment:
      - DSM_HOST=${DSM_HOST}
      - DSM_PORT=${DSM_PORT:-5001}
      - DSM_HTTPS=${DSM_HTTPS:-true}
      - DSM_USER=${DSM_USER}
      - DSM_PASSWORD=${DSM_PASSWORD}
      - DSM_VERIFY_SSL=${DSM_VERIFY_SSL:-true}
      - DSM_TLS_SERVERNAME=${DSM_TLS_SERVERNAME:-}
      - DSM_TLS_FINGERPRINT=${DSM_TLS_FINGERPRINT:-}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}
      - MCP_ALLOW_WRITE=${MCP_ALLOW_WRITE:-false}
      - CMS_PATCH_DIR=${CMS_PATCH_DIR:-}
      - MCP_VOLUME_WARN_PERCENT=${MCP_VOLUME_WARN_PERCENT:-85}
      - MCP_DISK_TEMP_WARN=${MCP_DISK_TEMP_WARN:-55}
      - MCP_DISK_LIFE_WARN_PERCENT=${MCP_DISK_LIFE_WARN_PERCENT:-20}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
    ports:
      # Zugriffskontrolle ist das Bearer-Token, TLS macht der Reverse-Proxy. Standardmässig nur auf localhost
      # gemappt; für einen Reverse-Proxy auf einem anderen Host MCP_BIND_ADDR auf die LAN-IP setzen.
      - "${MCP_BIND_ADDR:-127.0.0.1}:${MCP_HOST_PORT:-8432}:8000"
