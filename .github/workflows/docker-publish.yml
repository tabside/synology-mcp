name: Docker Image bauen und veroeffentlichen

# Baut bei jedem Push auf main ein neues Docker-Image aus dem Dockerfile und
# veroeffentlicht es auf GitHub Container Registry (ghcr.io). Portainer zieht
# das fertige Image dann per normalem "Pull and redeploy" - kein lokaler Build
# auf dem Docker-Host mehr noetig (das war die Ursache der "pull access
# denied"-Fehler: Portainer kann Images zuverlaessig NUR pullen, nicht aus
# einem Dockerfile im Repo neu bauen - bekannte Einschraenkung).

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "pyproject.toml"
      - "synology_mcp/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          # Volle Historie, damit die Patch-Version (Anzahl Commits) stimmt
          fetch-depth: 0

      - name: Version ermitteln
        id: version
        run: |
          base=$(sed -n 's/^version = "\([0-9]*\.[0-9]*\)\..*"$/\1/p' pyproject.toml)
          count=$(git rev-list --count HEAD -- Dockerfile requirements.txt pyproject.toml synology_mcp/ .github/workflows/docker-publish.yml)
          test -n "$base" && test -n "$count"
          echo "version=${base}.${count}" >> "$GITHUB_OUTPUT"
          echo "Version: ${base}.${count}"

      - name: Image-Namen in Kleinbuchstaben ermitteln
        id: image
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}

      - name: Bei GitHub Container Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Buildx aufsetzen
        uses: docker/setup-buildx-action@v3

      - name: Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
